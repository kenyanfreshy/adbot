<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdBot</title>
<meta name="description" content="Ads, budgets, bot rules and trading in one place">
<meta name="theme-color" content="#0c0911">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdBot">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div id="boot" class="boot"><img src="/static/icon-192.png" alt="" width="72" height="72"></div>

<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="/static/icon-192.png" alt="" width="88" height="88" class="avatar-lg">
    <h1>AdBot</h1>
    <p>Ads, budgets, bot rules and trading for Rapid Nursing Review, CCRN Adult and NurseBound.</p>
    <label class="sr" for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn primary block" type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div id="app" class="app" hidden>
  <header class="top">
    <img src="/static/icon-192.png" alt="" width="36" height="36" class="avatar">
    <div class="ttl"><b id="title">Ads</b><small id="subtitle">Rapid Nursing Review · CCRN Adult · NurseBound</small></div>
    <span class="pill" id="modePill"></span>
    <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  </header>

  <div class="filters" id="filters">
    <div class="chips" id="appChips" role="group" aria-label="App"></div>
    <div class="row2">
      <select id="channel" aria-label="Channel"><option value="all">All channels</option><option>Apple Search Ads</option><option>Meta Ads</option><option>Google Ads</option></select>
      <select id="days" aria-label="Period"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="90">90 days</option></select>
    </div>
  </div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="ads" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Ads</span></button>
    <button data-tab="keywords"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M16 7l3 3M14 9l2 2"/></svg><span>Keywords</span></button>
    <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Rules</span></button>
    <button data-tab="trading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Trading</span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Log</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/web/app.js" defer></script>
</body>
</html>
